name: CI

# The project claims to run in CI with no key and no model provider. This is
# that claim, tested on every push: a clean checkout, no secrets, no network
# to any model — just the offline detectors and the report contract.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per branch or PR. Pushing three commits in quick succession
# otherwise starts three full five-version matrices, of which only the last
# describes the code anyone will merge. Superseded runs are cancelled.
#
# Deliberately NOT applied to release.yml: cancelling a publish mid-flight
# could leave a partial upload, and a PyPI upload cannot be redone.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor and is easy to break by accident — every
        # `X | Y` annotation only works because of `from __future__ import
        # annotations`. Test the floor and the ceiling.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  no-runtime-deps:
    name: Runtime stays dependency-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Install WITHOUT the dev extra: if a runtime dependency ever creeps in,
      # this job fails. "No wheels to build, works anywhere" is a feature, and
      # features that are not tested stop being true.
      - run: pip install .
      - name: Assert nothing but mcpsurface was installed
        run: |
          extra=$(pip list --format=freeze \
            | grep -viE '^(pip|setuptools|wheel|mcpsurface)==' || true)
          if [ -n "$extra" ]; then
            echo "Unexpected runtime dependencies:"; echo "$extra"; exit 1
          fi
          echo "Runtime dependency count: 0"
      - name: CLI runs on a stub target
        run: |
          # A URL target exits 1 with "transport not wired" — that is the
          # documented behaviour, so assert it rather than a zero exit.
          set +e
          out=$(mcpsurface https://example.com 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q "transport not wired" || exit 1

  build:
    name: Distributions build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
